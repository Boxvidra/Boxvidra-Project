name: Deploy Coming Soon Page

on:
  push:
    branches: ["Vidra-Project"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Coming Soon page
        run: |
          mkdir site
          echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Coming Soon</title></head><body><h1 style='text-align:center;margin-top:20%;font-family:sans-serif;'>Coming soon..</h1></body></html>" > site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
